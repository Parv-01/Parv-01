name: Generate Contribution Snake

on:
  schedule:
    # Runs every 12 hours — keeps the snake fresh
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

# Without this block, GITHUB_TOKEN is read-only by default on new repos.
# This is the root cause of the 403 "Permission denied" error.
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animation (dark + light versions)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push output to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
